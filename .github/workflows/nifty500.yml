name: Nifty 500 Breakout Scanner

on:
  schedule:
    - cron: '*/10 4-9 * * 1-5' # Runs during NSE market hours (approx 04:15 - 10:00 UTC)

jobs:
  scanner:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Install dependencies
        run: pip install -r requirements.txt
        
      - name: Run Nifty 500 Scanner
        run: python nifty500_scanner.py
